<!DOCTYPE HTML>
<html>

	<head>
	
		<title>Etsy clone</title>
		
		<meta property="og:title" content="Etsy Home page clone" />
		<meta property="og:type" content="website" />
		
		<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.css" integrity="sha512-kJlvECunwXftkPwyvHbclArO8wszgBGisiLeuDFwNM8ws+wKIw0sv1os3ClWZOcrEB2eRXULYUsm8OVRGJKwGA==" crossorigin="anonymous" referrerpolicy="no-referrer">
		
		<style>
		
			body{
				margin:0px;
			}
			header{
				height:120px;
				margin:0px;
				display:grid;
				border-bottom:1px solid lightgrey;
				column-gap: 10px;
				grid-template-columns: 10% 13% 52% 22%;
				grid-template-rows:auto 45px;
			}
			.img{
				height:100%;
				width:100%;
				margin:0px 0px 0px 0px;
			}
			.d1{
				height:70px;
				margin:7px 0px 0px 35px;
			}
			.menu{
				font-size:22px;
				margin:27px 0px 0px 20px;
				display:inline-block;
			}
			.Categories{
				font-size:18px;
				font-family:arial, sans-sarif;
				margin-left:10px;
			}
			.d3{
				height:50px;
				border-radius:25px;
				border:2px solid black;
				margin:17px 0px 0px -10px;
				background-color:white;
			}
			input{
				height:45px;
				width:90%;
				border-radius:25px;
				border:0px solid black;
				outline:none;
				font-size:18px;
				padding-left:10px;
			}
			.search{
				font-size:28px;
				margin:20px 0px 0px 10px;
			}
			.d4{
				display:flex;
			}
			.sign{
				height:30px;
				width:60px;
				border:0px solid black;
				margin:35px 0px 0px 15px;
				text-align:center;
				font-size:18px;
				font-family:arial, sans-sarif;
			}
			.ind-logo{
				height:30px;
				width:30px;
				border:0px solid black;
				outline:2px solid black;
				border-radius:100px;
				margin:30px 0px 0px 35px;
			
			}
			.row{
				width:1000%;
				text-align:center;
			}
			.s1{
				font-family:arial, sans-sarif;
				margin:10px 0px 0px 20px ;
				display:inline-block;
				text-decoration:bold;
			}
			
			.section{
				height:450px;
				margin-top:30px; 
				display:grid;
				grid-template-columns:38% 27% 29%;
				column-gap:20px;
				
			}
			.main{
				height:85%;
				border-radius:20px;
				margin:20px 0px 0px 30px;
			}
			.imd1{
				border-radius:20px 0px 0px 20px;
				background-color:skyblue;
				text-align:center;
				font-size:38px;
			}
			.text{
				margin:120px 0px 0px 20px;
			}
			.content{
				height:31px;
				width:150px;
				background-color:black;
				color:white;
				border-radius:20px;
				margin:20px 0px 0px 180px;
				font-size:18px;
				font-family:arial, sans-sarif;
				text-align:center;
				padding-top:9px;
			}
			.imd2{
				border-radius:0px 20px 20px 0px;
				margin-left:-20px;
			}
			.imd3{
				margin-left:0px;
				background-image:url('https://i.etsystatic.com/ij/1e502b/8276167818/ij_600x600.8276167818_jax3oksp.jpg?version=0');
				background-size:100% 100%;
			}	
			.most{
				font-size:28px;
				font-family:arial, sans-sarif;
				color:white;
				margin:73% 0px 0px 30px;
			}
			.section2{
				height:500px;
				border:1px solid black;
				margin:10px 0px 20px 0px;
				display:grid;
				grid-template-columns:23% 23% 23% 23%;
				column-gap:18px;
			}
			.sectioname{
				width:100%;
				background-color:yellow;
				font-size:20px;
				margin:10px 0px 10px 30px;
				font-family:arial, sans-sarif;
			}
			.s2_imag{
				height:420px;
				width:100%;
				border:0px solid black;
				border-radius:10px;
				background-color:white;
				margin:40px 0px 30px 30px;
			}
			.s2_imag:hover{
				background-color:lightgrey;
				transform:scale(101%);
			}
			.s2_imagdi{
				height:380px;
				width:90%;
				border:0px solid black;
				border-radius:10px;
				margin:10px 0px 0px 15px;
			}
			.img_edit{
				height:100%;
				width:100%;
				border-radius:10px;
			}
			.caption{
				font-size:16px;
				font-family:arial, sans-sarif;
				margin:11px 0px 0px 0px;
				text-align:center;
			}
		</style>
	</head>
	
	<body>
	
		<header>
			<div class="d1 ">
				<img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ7EGDO3LgyWL83RW530b8y7ReGwfsMAsotxavTARpEUQ&s" class="img">
				
			</div>
			
			<div class="d2"><i class="ri-menu-fill menu"></i><span class="Categories">Categories</span></div>
			
			<div class="d3 ">
				<input type="text" placeholder="Search for anything">
				<i class="ri-search-line search"></i>
			</div>
			
			<div class="d4">
			
				<div class="sign">Sign in</div>
				
				<div class="ind-logo">
					<img src="https://5.imimg.com/data5/SELLER/Default/2025/3/494387686/FK/LR/EE/56550666/indian-flag-badge-500x500.jpg"  height="100%" width="105%">
				</div>
				
				<i class="ri-heart-fill menu" style="font-size:26px;"></i><i class="ri-shopping-cart-fill menu" style="font-size:26px;"></i>
			</div>
			
			
			<div class="row">
				<span class="s1"><i class="ri-gift-fill"></i>Gift</span>
				<span class="s1">Autumn Hosting & Decor</span>
				<span class="s1">Home Favourites</span>
				<span class="s1">Fashion Finds</span>
				<span class="s1">Vintage</span>
				<span class="s1">Wedding Guide</span>
			</div>
		</header>
		
		
		<main>
		
			<section class="section">
			
				<div class="main imd1"> <p class="text">Our Top 100 Christmas <br>Gifts are here</p>
					<div class="content">See the full list</div>
				</div>
				
				<div class="main imd2">
					<img src="https://i.etsystatic.com/ij/653d61/8678949966/ij_680x540.8678949966_jzylec8p.jpg?version=0" height="100%" width="100%" style="border-radius:0px 20px 20px 0px">
				</div>
				
				<div class="main imd3">
					<p class="most">Most Whimsical Finds <br>Shop now</p>
				</div>
			</section>
			
			<section class="section2">
				<!-- <div class="sectioname">Jump into featured interests</div> -->
				
				<div class="s2_imag">
					<figure class="s2_imagdi">
						<img src="https://i.etsystatic.com/16411663/r/il/eb412b/3768521399/il_510x680.3768521399_8pic.jpg" class="img_edit">
					</figure>
					<figcaption class="caption">Piercing Ear Jewelry</figcaption>
				</div>
				
				<div class="s2_imag">
					<figure class="s2_imagdi">
						<img src="https://i.etsystatic.com/51103332/r/il/cf5099/8073959948/il_510x680.8073959948_jhy3.jpg" class="img_edit">
					</figure>
					<figcaption class="caption">Bridesmaid Gift Bags</figcaption>
				</div>
				
				<div class="s2_imag">
					<figure class="s2_imagdi">
						<img src="https://i.etsystatic.com/23449844/r/il/4cc6df/6213375419/il_510x680.6213375419_kwer.jpg" class="img_edit">
					</figure>
					<figcaption class="caption">Custom Photo Gifts</figcaption>
				</div>
				
				<div class="s2_imag">
					<figure class="s2_imagdi">
						<img src="https://i.etsystatic.com/51883689/r/il/5b7f7b/6353764857/il_510x680.6353764857_8n3e.jpg" class="img_edit">
					</figure>
					<figcaption class="caption">Eco-Conscious Home</figcaption>
				</div>
			</section>
		
		</main>
	</body>
</html>
